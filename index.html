<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f7b">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
<title>Estoque 360</title>

<style>
:root{
  --blue:#123f7b;
  --blue2:#0d3265;
  --brand:#087fe8;
  --cyan:#08b9f4;
  --green:#13a875;
  --orange:#f28a08;
  --bg:#edf4fb;
  --text:#142d47;
  --muted:#697b8d;
  --card:#fff;
  --line:#dfe7ee;
  --shadow:0 5px 18px rgba(25,67,105,.10);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
html{
  touch-action:pan-y;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}

/* ===== CABEÇALHO — mesmo conceito visual do EPI 360 ===== */
.top{
  background:var(--blue);
  color:#fff;
  min-height:370px;
  padding:48px 20px 34px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:none;
  position:relative;
  border-radius:0 0 64px 64px;
}
.brand-logo{
  width:min(300px,72vw);
  height:auto;
  max-height:175px;
  object-fit:contain;
  display:block;
  margin:0 auto 15px;
}
.brand-title{
  margin:0;
  font-size:34px;
  line-height:1.05;
  font-weight:800;
  letter-spacing:.1px;
  color:#fff;
  text-align:center;
  text-transform:uppercase;
}
.brand-subtitle{
  margin:14px 0 0;
  font-size:19px;
  line-height:1.25;
  color:#fff;
  text-align:center;
  opacity:.98;
  max-width:620px;
}
.header-actions{
  position:absolute;
  left:12px;
  right:12px;
  top:10px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:5;
}
.iconbtn{
  pointer-events:auto;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
}
.iconbtn[hidden]{display:none}

/* ===== ÁREA PRINCIPAL ===== */
.content{
  width:min(700px,100%);
  margin:auto;
  padding:24px 18px 34px;
}

/* Menu 2 x 2, como no EPI 360 */
.navbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:0 0 26px;
}
.home-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:0 0 26px;
}
.home-grid .navbtn{
  min-height:78px;
}

.navbtn{
  border:1px solid #e2e7ed;
  background:#fff;
  color:#142d47;
  border-radius:27px;
  min-height:78px;
  padding:10px 8px;
  font-weight:800;
  box-shadow:0 4px 13px rgba(20,67,105,.08);
  font-size:17px;
  line-height:1.15;
}
.navbtn.active{
  background:#2169d5;
  color:#fff;
  border-color:#2169d5;
}
.navicon{
  font-size:25px;
  display:inline-block;
  margin-right:7px;
  vertical-align:-3px;
}

/* ===== DASHBOARD: 2 x 2, igual à família do EPI ===== */
.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:0 0 26px;
}
.metric{
  background:#fff;
  border-radius:28px;
  padding:19px 18px;
  box-shadow:var(--shadow);
  min-height:112px;
  text-align:left;
  display:grid;
  grid-template-columns:76px 1fr;
  grid-template-rows:auto auto;
  column-gap:10px;
  align-items:center;
}
.metric .label{
  font-size:17px;
  line-height:1.2;
  color:var(--muted);
  display:block;
  white-space:normal;
  grid-column:2;
  grid-row:1;
}
.metric .value{
  font-size:34px;
  line-height:1;
  font-weight:800;
  margin-top:4px;
  color:#132b45;
  grid-column:2;
  grid-row:2;
}
.metric .hint{
  display:none;
}
.home-consult{border:0;width:100%;font:inherit;color:inherit;cursor:pointer;text-align:left;position:relative;transition:transform .15s ease,box-shadow .15s ease}
.home-consult:hover{transform:translateY(-1px)}
.home-consult:active{transform:scale(.99)}
.home-consult:before{content:'🔎';grid-column:1;grid-row:1 / span 2;width:66px;height:66px;border-radius:50%;background:#eef6ff;display:flex;align-items:center;justify-content:center;font-size:32px}
.home-consult .label{grid-column:2;grid-row:1}
.home-consult .value{grid-column:2;grid-row:2;font-size:20px;color:#2169d5}

/* Ícone visual dos indicadores */
.metric:before{
  grid-column:1;
  grid-row:1 / span 2;
  width:66px;
  height:66px;
  border-radius:50%;
  background:#eef6ff;
  display:grid;
  place-items:center;
  font-size:34px;
}
.metric:nth-child(1):before{content:"📦"}
.metric:nth-child(2):before{content:"📊"}
.metric:nth-child(3):before{content:"📤"}
.metric:nth-child(4):before{content:"↩️"}

/* ===== BLOCO DE ÚLTIMAS MOVIMENTAÇÕES ===== */
.section-card{
  background:#fff;
  border-radius:30px;
  padding:24px 22px;
  box-shadow:var(--shadow);
  margin:0;
}
.section-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.section-head h3{
  margin:0;
  font-size:27px;
  line-height:1.1;
}
.section-head p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:17px;
  line-height:1.3;
}
.refresh{
  border:1px solid #d8e1e8;
  background:#fff;
  border-radius:18px;
  padding:12px 16px;
  font-size:16px;
  font-weight:800;
  color:var(--text);
  white-space:nowrap;
}
.activity-list{
  margin-top:24px;
  display:grid;
  gap:9px;
}
.activity{
  border:1px solid #e3eaf0;
  border-radius:16px;
  padding:11px 12px;
  display:grid;
  grid-template-columns:44px 1fr auto;
  gap:10px;
  align-items:center;
  min-height:64px;
}
.activity .act-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#eef6ff;
  display:grid;
  place-items:center;
  font-size:22px;
}
.activity .act-main{min-width:0}
.activity b{
  font-size:15px;
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.activity small{
  display:block;
  color:var(--muted);
  margin-top:4px;
  font-size:12px;
  line-height:1.3;
}
.activity .pill{
  font-size:11px;
  font-weight:800;
  border-radius:14px;
  padding:7px 9px;
  white-space:nowrap;
}
.activity .pill.saida{background:#ffe8e6;color:#d64b40}
.activity .pill.devolucao{background:#def7ea;color:#159768}.activity .pill.entrada{background:#e5f2ff;color:#146bb4}
.empty{
  color:var(--muted);
  font-size:16px;
  line-height:1.4;
  padding:34px 14px;
  text-align:center;
}
.bottomnote{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:18px auto 0;
}

/* ===== TELAS INTERNAS — mesma linguagem visual ===== */
.page-title{
  font-size:29px;
  margin:4px 0 18px;
  font-weight:800;
}
.panel{
  background:#fff;
  border-radius:24px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
.field label{
  font-size:15px;
  font-weight:800;
  display:block;
  margin-bottom:8px;
}
.inputrow{display:flex;gap:8px}
.input,.select{
  width:100%;
  height:52px;
  border:1px solid #cbd9e5;
  border-radius:14px;
  padding:0 14px;
  outline:none;
  background:#fff;
  color:var(--text);
}
.input:focus,.select:focus{
  border-color:#1688ef;
  box-shadow:0 0 0 3px rgba(22,136,239,.10)
}
.primary,.secondary{
  width:100%;
  border-radius:14px;
  min-height:52px;
  font-weight:800;
}
.primary{border:0;background:#2169d5;color:#fff}
.greenbtn{background:#0ab488}
.orangebtn{background:#f28a08}
.purplebtn{background:#5b45d8}
.secondary{border:1px solid #bcd2e3;background:#fff;color:#1267ad}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{
  border:1px solid #d6e4ee;
  background:#fff;
  border-radius:15px;
  padding:14px;
  font-weight:800;
  text-align:left;
}
.choice.active{
  border-color:#1b72df;
  background:#edf5ff;
  color:#1263b7;
}
.choice small{
  display:block;
  color:var(--muted);
  font-weight:400;
  margin-top:3px;
}
.limit{font-size:13px;color:var(--muted);margin-bottom:9px}
.searchbox{position:relative}
.suggestions{
  position:absolute;
  left:0;right:0;top:60px;
  background:#fff;
  border:1px solid #d5e3ee;
  border-radius:14px;
  box-shadow:0 10px 24px rgba(21,50,75,.16);
  z-index:30;
  overflow:hidden;
  max-height:300px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}
.suggestion{
  width:100%;
  border:0;
  background:#fff;
  padding:13px;
  text-align:left;
  border-bottom:1px solid #eef3f7;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.suggestion:last-child{border-bottom:0}
.suggestion b{font-size:14px}
.suggestion small{display:block;color:var(--muted);margin-top:3px}
.stock{font-size:12px;color:#176fb3;white-space:nowrap;text-align:right}
.items{display:grid;gap:9px}
.item{
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  background:#fbfdff
}
.itemtop{display:flex;gap:8px;align-items:flex-start}
.itemtop .num{
  width:28px;height:28px;border-radius:50%;
  background:#075fb8;color:#fff;display:grid;
  place-items:center;font-size:12px;font-weight:bold;flex:0 0 auto
}
.itemtop .desc{flex:1;font-size:14px;font-weight:700;line-height:1.25}
.itembottom{
  display:grid;
  grid-template-columns:95px 1fr;
  gap:8px;
  align-items:center;
  margin-top:9px;
  margin-left:36px
}
.qty,.returnqty{
  height:44px;
  border:1px solid #c8d9e5;
  border-radius:12px;
  padding:0 9px
}
.remove{
  border:0;background:#fff0ee;color:#d84b3e;
  width:38px;height:38px;border-radius:10px;margin-left:auto
}
.itemmeta{
  color:var(--muted);
  font-size:11px;
  margin-left:36px;
  margin-top:4px
}
.summary{
  background:#eef7ff;
  border-radius:14px;
  padding:13px;
  font-size:13px
}
.order-found{
  background:#e9f8f1;
  border:1px solid #b8e7d5;
  color:#147c5b;
  padding:13px;
  border-radius:14px;
  font-size:13px;
  margin-bottom:12px
}
.order-item{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px
}
.order-item .row{
  display:flex;justify-content:space-between;
  gap:10px;align-items:center
}
.order-item b{font-size:14px}
.order-item small{color:var(--muted);font-size:11px}
.history-tabs{display:flex;gap:8px;margin-bottom:12px}
.history-tab{
  border:1px solid #d6e3ed;
  background:#fff;border-radius:12px;
  padding:9px 11px;font-weight:700
}
.history-tab.active{background:#eaf3ff;border-color:#1c70dc;color:#125fae}
.toast{
  position:fixed;left:50%;bottom:15px;
  transform:translateX(-50%);
  background:#16344e;color:#fff;
  padding:11px 14px;border-radius:11px;
  z-index:50;display:none;max-width:92%;
  font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18)
}
.modal{
  position:fixed;inset:0;background:rgba(7,26,42,.55);
  display:none;align-items:flex-end;justify-content:center;z-index:40
}
.modalbox{
  background:#fff;width:min(620px,100%);
  border-radius:22px 22px 0 0;padding:19px;
  max-height:82vh;overflow:auto
}
.modalbox h3{margin:0 0 12px}
.modalactions{display:grid;gap:8px;margin-top:14px}
.status{
  padding:13px;border-radius:12px;
  background:#e9f8f1;color:#16805d;font-size:13px;margin:10px 0
}
.status.err{background:#fff0ee;color:#bd3c2f}

/* ===== TAMANHO DE CELULAR: referência direta do EPI 360 ===== */

<body>
<div class="app">
<header class="top">
  <div class="header-actions">
    <button id="backBtn" class="iconbtn" hidden aria-label="Voltar">‹</button>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbyxONwGIp_U8GnygyDBLEL6-UzfzXmeL31UzQ_QrKGis6h0h62h9T1j1IhHi0xEIZm2Yg/exec';
const SHEET_URL='https://docs.google.com/spreadsheets/d/1XNNRj4cvv34yUITVWSpGmEg0gD1oqlSXGmvC-mKhOr4/edit';
function openSheetTab(gid){window.open(SHEET_URL+'?gid='+encodeURIComponent(gid)+'#gid='+encodeURIComponent(gid),'_blank','noopener');}

const OBSERVACOES=['Para tarefa externa','Para uso da oficina','Para enrolamento de motor','Para uso em OS','Para uso da automação','Para tarefa interna','Para vendas','Para uso na peritagem'];
const DESTINOS_SAIDA={
  os:{label:'Ordem de Serviço',short:'OS',refLabel:'Referência da OS',placeholder:'Ex.: 4505 ou MANUTENÇÃO BOMBA 01'},
  tarefa:{label:'Ordem de Tarefa',short:'Tarefa',refLabel:'Referência da tarefa',placeholder:'Ex.: 79761190 ou TAREFA-EXT-23'},
  venda_balcao:{label:'Venda de balcão',short:'Venda de balcão',refLabel:'Referência da venda',placeholder:'Ex.: VENDA-001 ou nome do cliente'},
  venda_externa:{label:'Venda externa',short:'Venda externa',refLabel:'Referência da venda',placeholder:'Ex.: PEDIDO-001 ou nome do cliente'},
  emprestimo:{label:'Empréstimo',short:'Empréstimo',refLabel:'Referência do empréstimo',placeholder:'Ex.: EMP-001 ou responsável'},
  uso_interno:{label:'Uso interno',short:'Uso interno',refLabel:'',placeholder:''},
  outro:{label:'Outro',short:'Outro',refLabel:'Referência',placeholder:'Informe a referência da saída'}
};
const state={page:'home',items:[],entryItems:[],order:null,returnItems:[],destination:'os',activities:[],inventoryItems:[]};
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').style.display='none',3200)}
function apiReady(){if(API_URL.startsWith('COLE_')){toast('Configure a URL da API no index.html.');return false}return true}
function jsonp(params){return new Promise((resolve,reject)=>{if(!apiReady())return reject(new Error('API não configurada.'));const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const qs=new URLSearchParams({...params,callback:cb});const timer=setTimeout(()=>{cleanup();reject(new Error('Tempo esgotado ao consultar a planilha.'))},30000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('Não foi possível conectar à API.'))};script.src=API_URL+'?'+qs.toString();document.body.appendChild(script)})}
function post(payload){return new Promise((resolve,reject)=>{if(!apiReady())return reject(new Error('API não configurada.'));const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='postFrame';form.style.display='none';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payload);form.appendChild(input);document.body.appendChild(form);form.submit();form.remove();const started=Date.now();const poll=async()=>{try{const r=await jsonp({action:'status',tx:payload.tx});if(r.ok&&(r.status==='CONCLUIDO'||r.status==='ERRO'))return r.status==='CONCLUIDO'?resolve(r.result||r):reject(new Error(r.message||'Falha na operação.'))}catch(e){}if(Date.now()-started>25000)return reject(new Error('A planilha não confirmou a operação no tempo esperado.'));setTimeout(poll,1000)};setTimeout(poll,900)})}
function nav(page){state.page=page;closeModal();if(page==='home')renderHome();if(page==='new')renderNovaSaida();if(page==='return')renderReturn();if(page==='stock')renderStock();if(page==='inventory')renderInventario();if(page==='entry')renderEntrada();if(page==='history')renderHistory();if(page==='today')renderToday();$('backBtn').hidden=page==='home'}
$('backBtn').onclick=()=>nav('home');$('homeBtn').onclick=()=>nav('home');
function renderNav(){return `<nav class="navbar"><button class="navbtn ${state.page==='home'?'active':''}" onclick="nav('home')"><span class="navicon">⌂</span>Início</button><button class="navbtn ${state.page==='new'?'active':''}" onclick="nav('new')"><span class="navicon">📦</span>Nova saída</button><button class="navbtn ${state.page==='return'?'active':''}" onclick="nav('return')"><span class="navicon">↩</span>Devolução</button><button class="navbtn ${state.page==='history'?'active':''}" onclick="nav('history')"><span class="navicon">◷</span>Histórico</button></nav>`}
function renderHome(){state.page='home';$('content').innerHTML=`

  </div>
  <div class="activity-list">${renderActivities()}</div>
</section>
<div class="bottomnote">Grupo 360 Manutenção • Web App de estoque</div>`}
function renderActivities(){if(!state.activities.length)return '<div class="empty">Nenhuma movimentação encontrada no sistema.</div>';return state.activities.slice(0,8).map(a=>{const dev=a.kind==='devolucao';const ent=a.kind==='entrada';const title=esc(a.title||'Movimentação');const detail=esc(a.detail||'');return `<div class="activity"><div class="act-icon">${dev?'↩️':ent?'📥':'⚙️'}</div><div class="act-main"><b>${title}</b><small>${detail}<br>${esc(a.when||'')}</small></div><span class="pill ${dev?'devolucao':ent?'entrada':'saida'}">${dev?'↩ Devolução':ent?'↓ Entrada':'↑ Saída'}</span></div>`}).join('')}

function loadActivities(){return []}
function nowLabel(){return new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function setDestination(type){
  if(!DESTINOS_SAIDA[type])type='os';
  state.destination=type;
  const cfg=DESTINOS_SAIDA[type];
  const lab=$('orderLabel'),inp=$('orderNumber'),wrap=$('destinationReference'),limit=$('saidaLimit');
  const needsReference=type!=='uso_interno';
  if(wrap)wrap.style.display=needsReference?'block':'none';
  if(lab)lab.textContent=cfg.refLabel;
  if(inp){inp.placeholder=cfg.placeholder;inp.value='';inp.required=needsReference;}
  if(limit)limit.textContent=type==='os'?'Materiais (máx. 15 por OS)':type==='tarefa'?'Materiais (máx. 20 por tarefa)':'Materiais';
}
let colaboradoresRequestId=0;

async function carregarColaboradoresSaida(){
  const select=$('receiver');
  const status=$('receiverStatus');
  if(!select)return;

  const requestId=++colaboradoresRequestId;
  select.innerHTML='<option value="">Carregando colaboradores...</option>';
  if(status)status.textContent='';

  try{
    const r=await jsonp({action:'colaboradores'});
    if(requestId!==colaboradoresRequestId)return;
    if(!r || !r.ok)throw new Error((r&&r.error)||'Não foi possível carregar a lista de colaboradores.');

    const lista=Array.isArray(r.colaboradores)?r.colaboradores:[];
    select.innerHTML='<option value="">Selecione o colaborador</option>';

    lista.forEach(c=>{
      const opt=document.createElement('option');
      opt.value=String(c.nome||'').trim();
      opt.textContent=String(c.nome||'').trim();
      if(c.empresa)opt.dataset.empresa=String(c.empresa);
      if(c.funcao)opt.dataset.funcao=String(c.funcao);
      select.appendChild(opt);
    });

    if(!lista.length){
      select.innerHTML='<option value="">Nenhum colaborador ativo cadastrado</option>';
      throw new Error('Nenhum colaborador ativo foi encontrado na aba COLABORADORES.');
    }
  }catch(e){
    if(requestId!==colaboradoresRequestId)return;
    select.innerHTML='<option value="">Não foi possível carregar a lista de colaboradores</option>';
    if(status)status.textContent='⚠️ '+String(e.message||e);
    toast(String(e.message||e));
  }
}

function marcarColaboradorSelecionado(){
  const select=$('receiver'),status=$('receiverStatus');
  if(!select)return;
  const opt=select.options[select.selectedIndex];
  if(status){
    status.textContent=select.value
      ? '✓ Colaborador selecionado'
      : '';
  }
}

function renderNovaSaida(){state.items=[];$('content').innerHTML=`<h2 class="page-title">Nova saída</h2><section class="panel"><div class="field">
<label>Quem pediu / vai receber o material</label>
<select id="receiver" class="select" onchange="marcarColaboradorSelecionado()">

</select>
<div id="receiverStatus" style="margin-top:6px;font-size:12px;color:#16805d"></div>
</div><div class="field"><label>Para onde foi</label><select id="destination" class="select" onchange="setDestination(this.value)">
  <option value="os">📋 Ordem de Serviço (OS)</option>

async function searchMaterial(q){clearTimeout(searchTimer);const box=$('suggestions'),term=q.trim();if(!term){materialRequestId++;box.style.display='none';return}if(term.length<2){box.style.display='none';return}const requestId=++materialRequestId;searchTimer=setTimeout(async()=>{try{const r=await jsonp({action:'products',q:term});if(requestId!==materialRequestId)return;if(!r.ok)throw new Error(r.error);const products=Array.isArray(r.products)?r.products:[];box.innerHTML=products.map(p=>`<button class="suggestion" onclick='addItem(${JSON.stringify(p)})'><span><b>${esc(p.code)}</b><small>${esc(p.description)}</small></span><span class="stock">Est.: ${esc(p.stock)}<br>${esc(p.unit)}</span></button>`).join('')||'<div class="suggestion">Nenhum material encontrado.</div>';box.style.display='block'}catch(e){if(requestId!==materialRequestId)return;toast(e.message)}},250)}

function parseExitLine(line){
  let t=String(line||'').trim();
  if(!t)return null;
  t=t.replace(/^[-•]+\s*/, '');
  const m=t.match(/^(.+?)\s*(?:\||;|\t|,)\s*(\d+(?:[\.,]\d+)?)\s*$/)
       || t.match(/^(.+?)\s+(\d+(?:[\.,]\d+)?)\s*$/);
  if(!m)return {term:t,qty:null};
  return {term:m[1].trim(),qty:Number(m[2].replace(',','.'))};
}
function normalizeExitMatch(value){
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function clearExitList(){
  const el=$('saidaBulk');
  if(el)el.value='';
}
async function importExitList(){
  const text=String($('saidaBulk')?.value||'');
  if(!text.trim())return toast('Cole a lista de materiais e quantidades.');
  const parsed=text.split(/\r?\n/).map(parseExitLine).filter(Boolean);
  const invalid=parsed.filter(x=>!x.term||!Number.isFinite(x.qty)||x.qty<=0);
  if(invalid.length){
    return openModal(`<h3>Confira a lista</h3><div class="status err">${invalid.length} linha(s) não têm quantidade válida. Use o formato: <b>ROL008 2</b>.</div><button class="secondary" onclick="closeModal()">FECHAR</button>`);
  }

  const max=state.destination==='os'?15:state.destination==='tarefa'?20:50;
  const resolved=[];
  const errors=[];
  for(let i=0;i<parsed.length;i++){
    const line=parsed[i];
    try{
      const r=await jsonp({action:'products',q:line.term});
      if(!r||!r.ok)throw new Error(r?.error||'Falha na consulta');
      const products=Array.isArray(r.products)?r.products:[];
      const needle=line.term.trim();
      let matches=products.filter(p=>String(p.code||'').trim().toUpperCase()===needle.toUpperCase());
      if(!matches.length){
        const descKey=normalizeExitMatch(needle);
        matches=products.filter(p=>normalizeExitMatch(p.description)===descKey);
      }
      if(matches.length===0)throw new Error(`linha ${i+1}: "${needle}" não encontrado`);
      if(matches.length>1)throw new Error(`linha ${i+1}: "${needle}" corresponde a mais de um material; use o código`);
      resolved.push({...matches[0],qty:line.qty,note:''});
    }catch(e){
      errors.push(String(e.message||e));
    }
  }

  if(errors.length){
    openModal(`<h3>Não foi possível ler toda a lista</h3><div class="status err">${errors.map(esc).join('<br>')}</div><p>Corrija as linhas indicadas e leia a lista novamente. Nenhum item desta lista foi adicionado.</p><button class="secondary" onclick="closeModal()">FECHAR</button>`);
    return;
  }

  const merged=new Map();
  [...state.items,...resolved].forEach(p=>{
    const key=String(p.code||'').trim().toUpperCase();
    if(!merged.has(key))merged.set(key,{...p,qty:Number(p.qty)||1,note:p.note||''});
    else merged.get(key).qty+=Number(p.qty)||1;
  });
  const next=Array.from(merged.values());
  if(next.length>max){
    return openModal(`<h3>Limite de materiais excedido</h3><div class="status err">Este destino permite até ${max} materiais diferentes. A lista resultaria em ${next.length} materiais. Nenhum item foi adicionado.</div><button class="secondary" onclick="closeModal()">FECHAR</button>`);
  }

  state.items=next;
  renderItems();
  clearExitList();
  if($('materialSearch'))$('materialSearch').value='';
  if($('suggestions'))$('suggestions').style.display='none';
  toast(`${resolved.length} linha(s) lida(s); confira quantidades e observações antes de registrar.`);
}

async function carregarHistoricoEntradas(q){
  const list=$('entryHistoryList');
  if(!list)return;
  list.innerHTML='<div class="empty">Carregando histórico...</div>';
  try{
    const r=await jsonp({action:'entryhistory',limit:100,q:String(q||'').trim()});
    if(!r.ok)throw new Error(r.error||'Não foi possível carregar o histórico de entradas.');
    const entries=Array.isArray(r.entries)?r.entries:[];
    if(!entries.length){list.innerHTML='<div class="empty">Nenhuma entrada encontrada.</div>';return;}
    list.innerHTML=entries.map(e=>{
      const status=String(e.status||'ATIVA').toUpperCase();
      const cls=status==='CANCELADA'?'status-cancelada':status==='EDITADA'?'status-editada':'';
      const itens=e.items||[];
      const resumo=itens.length===1
        ? `${esc(itens[0].description)} • ${esc(itens[0].qty)} ${esc(itens[0].unit||'UN')}`
        : `${itens.length} materiais • ${esc(e.totalQty)} unidades`;
      return `<div class="activity clickable ${cls}" style="margin-bottom:8px" role="button" tabindex="0" onclick="openMovement('${esc(e.tx||'')}')" onkeydown="if(event.key==='Enter'||event.key===' ')openMovement('${esc(e.tx||'')}')">

        <span class="pill entrada">${status==='CANCELADA'?'CANCELADA':status==='EDITADA'?'EDITADA':'ENTRADA'}</span><span class="chev">›</span>
      </div>`;
    }).join('');
  }catch(e){list.innerHTML=`<div class="status err">${esc(e.message)}</div>`}
}

async function searchInventoryMaterial(q){

  if(!term){inventorySearchId++;box.style.display='none';return} if(term.length<2){box.style.display='none';return}
  const id=++inventorySearchId; inventorySearchTimer=setTimeout(async()=>{try{

function addInventoryMaterial(p){
  const code=String(p.code||'').trim(); if(!code)return;
  const idx=state.inventoryItems.findIndex(x=>String(x.code).toUpperCase()===code.toUpperCase());
  if(idx>=0){toast('Esse material já está no inventário.');return}
  state.inventoryItems.push({...p,count:Number(p.stock)||0,note:''});

}
function renderInventoryItems(){
  const el=$('inventoryItems'),count=$('inventoryCount'); if(!el)return; count.textContent=`${state.inventoryItems.length} material(is) em conferência`;
  if(!state.inventoryItems.length){el.innerHTML='<div class="empty">Adicione um material ou leia uma lista.</div>';return}
  el.innerHTML=state.inventoryItems.map((p,i)=>{const d=Number(p.count)-Number(p.stock||0);const cls=d>0?'plus':d<0?'minus':'zero';const sign=d>0?'+':'';return `<div class="inventory-item"><div class="toprow"><span class="num">${i+1}</span><div class="desc">${esc(p.description)}<div class="meta">${esc(p.code)} • ${esc(p.unit||'UN')}</div></div><button class="remove" onclick="removeInventoryItem(${i})">🗑</button></div><div class="balances"><div class="balance">ESTOQUE SISTEMA<b>${esc(p.stock)}</b></div><div class="balance">CONTAGEM FÍSICA<b><input class="qty" style="width:100%;height:38px" type="number" min="0" step="any" value="${esc(p.count)}" onchange="setInventoryCount(${i},this.value)"></b></div><div class="difference ${cls}">DIFERENÇA<b>${sign}${esc(d)}</b></div></div></div>`}).join('');

function setInventoryCount(i,v){const n=Number(v);if(!Number.isFinite(n)||n<0){toast('A contagem deve ser zero ou maior.');return}state.inventoryItems[i].count=n;renderInventoryItems()}
function removeInventoryItem(i){state.inventoryItems.splice(i,1);renderInventoryItems()}

function parseInventoryLine(line){
  let t=String(line||'').trim(); if(!t)return null;
  t=t.replace(/^[-•]+\s*/, '');
  const m=t.match(/^(.+?)\s*(?:\||;|,|\t)\s*(-?\d+(?:[\.,]\d+)?)\s*$/);
  if(m)return {code:m[1].trim(),count:Number(m[2].replace(',','.'))};
  const m2=t.match(/^(.+?)\s+(-?\d+(?:[\.,]\d+)?)\s*$/);
  if(m2)return {code:m2[1].trim(),count:Number(m2[2].replace(',','.'))};
  return {code:t,count:null};
}
async function importInventoryList(){
  const text=String($('inventoryBulk').value||''); if(!text.trim())return toast('Cole a lista de códigos e quantidades.');
  const parsed=text.split(/\r?\n/).map(parseInventoryLine).filter(Boolean); const invalid=parsed.filter(x=>!x.code||!Number.isFinite(x.count)||x.count<0);
  if(invalid.length)return toast(`Não consegui ler ${invalid.length} linha(s). Use: ROL001 5`);
  const results=[]; const errors=[];
  for(const item of parsed){
    try{const r=await jsonp({action:'inventoryproducts',q:item.code});const exact=(r.products||[]).find(p=>String(p.code).trim().toUpperCase()===item.code.trim().toUpperCase()); if(!exact)throw new Error(`${item.code}: código não encontrado`); results.push({...exact,count:item.count,note:''});}catch(e){errors.push(e.message)}
  }
  const map=new Map(state.inventoryItems.map(x=>[String(x.code).toUpperCase(),x])); results.forEach(x=>map.set(String(x.code).toUpperCase(),x)); state.inventoryItems=Array.from(map.values()); renderInventoryItems();
  if(errors.length)toast(`Lista carregada com ${errors.length} erro(s). Veja os códigos não encontrados.`); else toast(`${results.length} material(is) carregado(s).`);
  if($('inventoryBulk'))$('inventoryBulk').value='';
}

function formatServerDate(v){
  if(!v)return '';
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return String(v);
  return d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
}
function activityFromMovement(m){
  const kind=m.kind==='entrada'?'entrada':m.kind==='devolucao'?'devolucao':'saida';
  return {
    kind,
    title:m.title||'Movimentação',
    detail:m.detail||'',
    when:formatServerDate(m.when),
    tx:m.tx,
    status:m.status||'ATIVA',
    movement:m
  };
}

  try{
    const r=await jsonp({action:'recent',limit:12});
    if(!r.ok)throw new Error(r.error||'Não foi possível carregar as movimentações.');
    state.activities=(r.movements||[]).map(activityFromMovement);

  }

function renderActivities(){
  if(!state.activities.length)return '<div class="empty">Nenhuma movimentação encontrada.</div>';
  return state.activities.slice(0,8).map(a=>{
    const dev=a.kind==='devolucao', ent=a.kind==='entrada';
    const status=String(a.status||'ATIVA').toUpperCase();
    const cls=status==='CANCELADA'?'status-cancelada':status==='EDITADA'?'status-editada':'';
    const pillClass=dev?'devolucao':ent?'entrada':'saida';
    const pillText=dev?'↩ Devolução':ent?'↓ Entrada':'↑ Saída';
    return `<div class="activity clickable ${cls}" onclick="openMovement('${esc(a.tx||'')}')">
      <div class="act-icon">${dev?'↩️':ent?'📥':'📤'}</div>
      <div class="act-main"><b>${esc(a.title||'Movimentação')}</b><small>${esc(a.detail||'')}<br>${esc(a.when||'')}</small></div>

  state.editType=currentType;renderEditItems();
}
function setEditType(type){if(!DESTINOS_SAIDA[type])type='os';state.editType=type;const cfg=DESTINOS_SAIDA[type];const label=$('editNumberLabel'),input=$('editNumber');if(label)label.textContent=cfg.refLabel;if(input){input.placeholder=cfg.placeholder;input.value='';}}
async function searchEditMaterial(q){
  const box=$('editSuggestions'),term=q.trim();
  if(!term){box.style.display='none';return}
  if(term.length<2){box.style.display='none';return}
  try{
    const r=await jsonp({action:'products',q:term});if(!r.ok)throw new Error(r.error);
    box.innerHTML=(r.products||[]).map(p=>`<button class="suggestion" onclick='addEditItem(${JSON.stringify(p)})'><span><b>${esc(p.code)}</b><small>${esc(p.description)}</small></span><span class="stock">Est.: ${esc(p.stock)}<br>${esc(p.unit)}</span></button>`).join('')||'<div class="suggestion">Nenhum material encontrado.</div>';
    box.style.display='block';
  }catch(e){toast(e.message)}
}
function addEditItem(p){
  if(state.editItems.some(x=>x.code===p.code)){toast('Esse material já está na movimentação.');return}
  state.editItems.push({...p,qty:1,note:''});renderEditItems();$('editSearch').value='';$('editSuggestions').style.display='none';
}
function renderEditItems(){
  const el=$('editItems');if(!el)return;
  if(!state.editItems.length){el.innerHTML='<div class="empty">Nenhum material.</div>';return}
  el.innerHTML=state.editItems.map((p,i)=>`<div class="item"><div class="itemtop"><span class="num">${i+1}</span><div class="desc">${esc(p.description)}</div><button class="remove" onclick="removeEditItem(${i})">🗑</button></div><div class="itemmeta">${esc(p.code)} • ${esc(p.unit||'UN')}</div><div class="itembottom"><input class="qty" type="number" min="0.001" step="any" value="${esc(p.qty)}" onchange="state.editItems[${i}].qty=Number(this.value)"><select class="input" style="height:42px" onchange="state.editItems[${i}].note=this.value"><option value="">Observação</option>${OBSERVACOES.map(o=>`<option value="${esc(o)}" ${p.note===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div></div>`).join('');
}
function removeEditItem(i){state.editItems.splice(i,1);renderEditItems()}
function renderEditEntrada(m){
  state.page='edit';$('backBtn').hidden=false;
  $('content').innerHTML=`<div class="editbar"><button onclick="editBack()">← Voltar</button><h2 class="page-title" style="margin:0">✏️ Editar entrada</h2></div>
  <section class="panel"><div class="field"><label>Fornecedor</label><input id="editSupplier" class="input" value="${esc(m.supplier||'')}"></div><div class="field"><label>NF-e</label><input id="editNF" class="input" value="${esc(m.nf||'')}"></div></section>
  <section class="panel"><div class="searchbox"><input id="editEntrySearch" class="input" placeholder="Adicionar material..." oninput="searchEditEntryMaterial(this.value)"><div id="editEntrySuggestions" class="suggestions" style="display:none"></div></div><div id="editEntryItems" class="items" style="margin-top:10px"></div></section>
  <section class="panel"><div class="field"><label>Observação</label><input id="editObservation" class="input" value="${esc(m.note||'')}"></div><button class="primary greenbtn" onclick="confirmEdit()">✓ SALVAR ALTERAÇÕES</button></section>`;
  renderEditEntryItems();
}
async function searchEditEntryMaterial(q){
  const box=$('editEntrySuggestions'),term=q.trim();if(!term){box.style.display='none';return}if(term.length<2){box.style.display='none';return}
  try{const r=await jsonp({action:'products',q:term});if(!r.ok)throw new Error(r.error);box.innerHTML=(r.products||[]).map(p=>`<button class="suggestion" onclick='addEditEntryItem(${JSON.stringify(p)})'><span><b>${esc(p.code)}</b><small>${esc(p.description)}</small></span><span class="stock">Est.: ${esc(p.stock)}<br>${esc(p.unit)}</span></button>`).join('')||'<div class="suggestion">Nenhum material encontrado.</div>';box.style.display='block'}catch(e){toast(e.message)}
}
function addEditEntryItem(p){if(state.editItems.some(x=>x.code===p.code)){toast('Esse material já está na entrada.');return}state.editItems.push({...p,qty:1,note:''});renderEditEntryItems();$('editEntrySearch').value='';$('editEntrySuggestions').style.display='none'}
function renderEditEntryItems(){const el=$('editEntryItems');if(!el)return;if(!state.editItems.length){el.innerHTML='<div class="empty">Nenhum material.</div>';return}el.innerHTML=state.editItems.map((p,i)=>`<div class="item"><div class="itemtop"><span class="num">${i+1}</span><div class="desc">${esc(p.description)}</div><button class="remove" onclick="removeEditItem(${i})">🗑</button></div><div class="itemmeta">${esc(p.code)} • ${esc(p.unit||'UN')}</div><div class="itembottom"><input class="qty" type="number" min="0.001" step="any" value="${esc(p.qty)}" onchange="state.editItems[${i}].qty=Number(this.value)"></div></div>`).join('')}
function renderEditDevolucao(m){
  state.page='edit';$('backBtn').hidden=false;
  $('content').innerHTML=`<div class="editbar"><button onclick="editBack()">← Voltar</button><h2 class="page-title" style="margin:0">✏️ Editar devolução</h2></div>
  <section class="panel"><div class="summary"><b>${esc(m.title)}</b><br>Altere as quantidades que devem voltar ao estoque.</div><div id="editItems" class="items" style="margin-top:10px"></div><button class="primary greenbtn" onclick="confirmEdit()">✓ SALVAR ALTERAÇÕES</button></section>`;
  renderEditItems();
}
function confirmEdit(){
  const m=state.editMovement;
  if(!m)return;
  const items=state.editItems.filter(x=>Number(x.qty)>0).map(x=>({code:x.code,qty:Number(x.qty),unit:x.unit,note:x.note||''}));
  if(!items.length)return toast('Informe pelo menos um material.');
  if(state.editItems.some(x=>!Number.isFinite(Number(x.qty))||Number(x.qty)<=0))return toast('Verifique as quantidades.');
  if(m.kind==='saida'){
    const number=$('editNumber').value.trim();const receiver=$('editReceiver').value.trim();
    if(!number||!receiver)return toast('Informe número e recebedor.');
    const cfg=DESTINOS_SAIDA[state.editType]||DESTINOS_SAIDA.os;
    openModal(`<h3>Salvar edição?</h3><div class="summary">${esc(cfg.short)} — ${esc(number)}<br>${esc(receiver)}<br>${items.length} material(is)</div><div class="modalactions"><button class="primary" onclick="doEdit()">CONFIRMAR EDIÇÃO</button><button class="secondary" onclick="closeModal()">CANCELAR</button></div>`);
  }else if(m.kind==='entrada'){
    const supplier=$('editSupplier').value.trim(),nf=$('editNF').value.trim();if(!supplier||!nf)return toast('Informe fornecedor e NF-e.');
    openModal(`<h3>Salvar edição?</h3><div class="summary">NF-e ${esc(nf)}<br>${esc(supplier)}<br>${items.length} material(is)</div><div class="modalactions"><button class="primary greenbtn" onclick="doEdit()">CONFIRMAR EDIÇÃO</button><button class="secondary" onclick="closeModal()">CANCELAR</button></div>`);
  }else{
    openModal(`<h3>Salvar edição?</h3><div class="summary">${esc(m.title)}<br>${items.length} material(is)</div><div class="modalactions"><button class="primary greenbtn" onclick="doEdit()">CONFIRMAR EDIÇÃO</button><button class="secondary" onclick="closeModal()">CANCELAR</button></div>`);
  }
}
async function doEdit(){
  closeModal();toast('Aplicando edição...');
  const m=state.editMovement;
  const tx='EDIT-'+Date.now()+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
  let payload={action:'editar',tx,originalTx:m.tx,kind:m.kind,items:state.editItems.filter(x=>Number(x.qty)>0).map(x=>({code:x.code,qty:Number(x.qty),unit:x.unit,note:x.note||''}))};
  if(m.kind==='saida'){payload.type=state.editType;payload.number=$('editNumber').value.trim();payload.receiver=$('editReceiver').value.trim()}
  if(m.kind==='entrada'){payload.supplier=$('editSupplier').value.trim();payload.nf=$('editNF').value.trim();payload.observation=$('editObservation').value.trim()}
  if(m.kind==='devolucao'){payload.type=m.type;payload.number=m.number}
  try{const r=await post(payload);await refreshRecent();openModal(`<h3>✓ Movimentação editada</h3><div class="status">${esc(r.message||'Edição realizada com sucesso.')}</div><button class="primary" onclick="closeModal();nav('home')">VOLTAR AO INÍCIO</button>`)}
  catch(e){openModal(`<h3>Não foi possível editar</h3><div class="status err">${esc(e.message)}</div><button class="secondary" onclick="closeModal()">FECHAR</button>`)}
}
function renderHistory(){
  state.page='history';
  $('content').innerHTML=`<h2 class="page-title">Histórico</h2><section class="section-card"><div class="section-head"><div><h3>🕘 Movimentações</h3><p>Histórico real do sistema.</p></div><button class="refresh" onclick="renderHistory()">⟳ Atualizar</button></div><div id="historyActivities" class="activity-list"><div class="empty">Carregando...</div></div></section>`;
  jsonp({action:'recent',limit:30}).then(r=>{if(!r.ok)throw new Error(r.error);state.activities=(r.movements||[]).map(activityFromMovement);$('historyActivities').innerHTML=renderActivities()}).catch(e=>{$('historyActivities').innerHTML=`<div class="status err">${esc(e.message)}</div>`});
}
function renderToday(){
  state.page='today';
  $('content').innerHTML=`<h2 class="page-title">📤 Saídas hoje</h2><section class="section-card"><div class="section-head"><div><h3>📤 Saídas</h3><p>Saídas registradas no sistema.</p></div><button class="refresh" onclick="renderToday()">⟳ Atualizar</button></div><div id="todayActivities" class="activity-list"><div class="empty">Carregando...</div></div></section>`;
  jsonp({action:'recent',limit:30}).then(r=>{if(!r.ok)throw new Error(r.error);const today=new Date().toLocaleDateString('pt-BR');const items=(r.movements||[]).map(activityFromMovement).filter(a=>a.kind==='saida'&&a.when.startsWith(today));$('todayActivities').innerHTML=items.length?renderActivitiesFrom(items):'<div class="empty">Nenhuma saída registrada hoje.</div>'}).catch(e=>{$('todayActivities').innerHTML=`<div class="status err">${esc(e.message)}</div>`});
}
function renderActivitiesFrom(items){return items.map(a=>{const cls=a.status==='CANCELADA'?'status-cancelada':a.status==='EDITADA'?'status-editada':'';return `<div class="activity clickable ${cls}" role="button" tabindex="0" onclick="openMovement('${esc(a.tx)}')" onkeydown="if(event.key==='Enter'||event.key===' ')openMovement('${esc(a.tx)}')"><div class="act-icon">📤</div><div class="act-main"><b>${esc(a.title)}</b><small>${esc(a.detail)}<br>${esc(a.when)}</small><small style="color:#1c70dc;font-weight:800">Toque para abrir • editar • desfazer</small></div><span class="pill saida">↑ Saída</span><span class="chev">›</span></div>`}).join('')}
</script>
<script>
renderHome();
</script>
<script>
// V18 — ao tocar fora dos resultados, fecha a lista para liberar a rolagem da tela.
document.addEventListener('pointerdown', function(e){
  const box=document.getElementById('suggestions');
  const search=document.getElementById('materialSearch');
  if(!box || box.style.display==='none') return;
  if(search && (e.target===search || search.contains(e.target))) return;
  if(box.contains(e.target)) return;
  box.style.display='none';
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      if (reg && reg.update) await reg.update();
    } catch (e) {}
  });
}
</script>
